schema: https://us-west-2.cdn.hygraph.com/content/cmcjgc5j107zx07n39xsh6whh/master

documents: "./src/graphql/**/*.graphql"

generates:
    ./src/graphql/generated.ts:
        plugins:
            - typescript
            - typescript-operations
            - typescript-react-apollo
        config:
            reactApolloVersion: 3
            withHooks: true
            withHOC: false
            withComponent: false

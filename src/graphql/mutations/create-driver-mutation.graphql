mutation CreateDriver(
	$name: String!
	$stream: String!
	$city: String!
	$equipment: String!
	$phone: String!
	$photo: AssetCreateOneInlineInput!
) {
	createDriver(
		data: {
			name: $name
			stream: $stream
			city: $city
			equipment: $equipment
			phone: $phone
			photo: $photo
		}
	) {
		id
	}
}

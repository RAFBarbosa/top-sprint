mutation UpdateCalendar(
	$where: CalendarWhereUniqueInput!
	$data: CalendarUpdateInput!
) {
	updateCalendar(where: $where, data: $data) {
		id
		track {
			id
			name
			flag {
				id
				url
			}
		}
		round
		sprint
		grid
		deleted
		active
		date
		link
		winnerA {
			id
			name
		}
		winnerB {
			id
			name
		}
		updatedAt
	}
}

# Add this to your GraphQL operations file
mutation UpdateDriver(
	$where: DriverWhereUniqueInput!
	$data: DriverUpdateInput!
) {
	updateDriver(where: $where, data: $data) {
		id
		name
		number
		grid
		stream
		deleted
		city
		equipment
		phone
		photo {
			url
		}
		team {
			id
			name
			color {
				hex
			}
			photo {
				url
			}
		}
	}
}

query GetBanners {
	banners(orderBy: createdAt_DESC) {
		id
		title
		content
		link
		category
		photo {
			id
			url
		}
		createdAt
		updatedAt
	}
}

query GetBannersRegistration {
	banners(orderBy: createdAt_DESC, stage: DRAFT) {
		id
		title
		content
		link
		category
		photo {
			id
			url
		}
		createdAt
	}
}

query GetBannersCategories {
	__type(name: "NewsCategory") {
		enumValues {
			name
		}
	}
}

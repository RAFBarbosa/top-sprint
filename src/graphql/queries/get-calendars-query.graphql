query GetCalendars {
	calendars(
		orderBy: date_ASC
		where: { active: true, deleted: false }
		stage: PUBLISHED
	) {
		id
		track
		round
		active
		deleted
		description
		date
		link
		flag {
			url
		}
	}
}

query GetCalendarsRegistration {
	calendars(orderBy: date_ASC, stage: DRAFT, where: { deleted: false }) {
		id
		track
		round
		active
		deleted
		description
		date
		link
		flag {
			url
		}
	}
}

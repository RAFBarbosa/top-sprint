query GetCalendars {
	calendars(
		orderBy: date_ASC
		where: { active: true, deleted: false }
		stage: DRAFT
	) {
		id
		track
		round
		active
		deleted
		winnerA {
			name
		}
		winnerB {
			name
		}
		map {
			url
		}
		grid
		description
		date
		link
		flag {
			url
		}
	}
}

query GetCalendarsRegistration {
	calendars(orderBy: date_ASC, stage: DRAFT, where: { deleted: false }) {
		id
		track
		round
		winnerA {
			name
		}
		winnerB {
			name
		}
		active
		map {
			url
		}
		grid
		deleted
		description
		date
		link
		flag {
			url
		}
	}
}

query GetCalendars {
	calendars(
		orderBy: date_ASC
		where: { active: true, deleted: false }
		stage: DRAFT
	) {
		id
		track {
			id
			location
			map {
				id
				url
			}
			flag {
				id
				url
			}
			name
		}
		sprint
		round
		link
		grid
		deleted
		date
		winnerA {
			id
			name
			grid
			class
			photo {
				id
				url
			}
			team {
				id
				color {
					hex
				}
			}
		}
		winnerB {
			name
			id
			photo {
				url
				id
			}
			team {
				id
				color {
					hex
				}
			}
			grid
			class
		}
	}
}


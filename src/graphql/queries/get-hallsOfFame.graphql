query GetHallsOfFame {
	hallsOfFame(
		stage: DRAFT
		orderBy: updatedAt_DESC
		where: { deleted: false }
	) {
		id
		season
		deleted
		legacy
		photo {
			id
			url
		}
	}
}

query GetHallsOfFameRegistration {
	hallsOfFame(
		orderBy: createdAt_DESC
		stage: DRAFT
		where: { deleted: false }
	) {
		id
		season
		deleted
		legacy
		photo {
			id
			url
		}
	}
}

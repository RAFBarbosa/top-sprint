query GetHallsOfFame {
	hallsOfFame(orderBy: createdAt_DESC, where: { deleted: false }) {
		id
		season
		deleted
		photo {
			url
		}
	}
}

query GetHallsOfFameRegistration {
	hallsOfFame(
		orderBy: createdAt_DESC
		stage: DRAFT
		where: { deleted: false }
	) {
		id
		season
		deleted
		photo {
			url
		}
	}
}

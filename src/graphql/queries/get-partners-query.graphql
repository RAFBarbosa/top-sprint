query GetPartners {
	partners(
		stage: DRAFT
		where: { active: true, deleted: false }
		orderBy: createdAt_ASC
	) {
		id
		name
		altText
		deleted
		image {
			url
		}
		footerLogo {
			url
		}
		link
		active
	}
}

query GetPartnersRegistration {
	partners(stage: DRAFT, orderBy: createdAt_ASC, where: { deleted: false }) {
		id
		name
		deleted
		footerLogo {
			url
		}
		link
		active
	}
}

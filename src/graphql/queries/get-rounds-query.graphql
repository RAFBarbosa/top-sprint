query GetSeasonRounds($slug: String!) {
	rounds(
		where: { season: { slug: $slug } }
		stage: PUBLISHED
		orderBy: date_ASC
	) {
		id
		name
		link
		date
		track {
			id
			name
			circuit
			location
			uniqueName
			flag {
				url
			}
		}
	}
}

query GetDrivers {
	drivers(stage: PUBLISHED) {
		id
		name
		grid
		number
		team {
			name
			color {
				hex
			}
		}
		photo {
			url
		}
		badge {
			url
		}
		badgeTitle
	}
}

query GetRoundResults($id: ID!) {
	round(where: { id: $id }, stage: PUBLISHED) {
		id
		name
		date
		link
		season {
			name
		}
		track {
			id
			name
			circuit
			location
			flag {
				url
			}
		}
		results
	}
}

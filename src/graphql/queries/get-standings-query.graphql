query GetTeams {
	drivers(stage: DRAFT, where: { deleted: false }) {
		id
		name
		number
		stream
		deleted
		city
		equipment
		grid
		class
		team {
			id
			name
			color {
				hex
			}
			photo {
				id
				url
			}
		}
		photo {
			id
			url
		}
		badge {
			id
			url
		}
		badgeTitle
	}
	teams(stage: DRAFT, where: { deleted: false }) {
		id
		name
		class
		deleted
		color {
			hex
		}
		photo {
			id
			url
		}
	}
}

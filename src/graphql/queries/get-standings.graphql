query GetTeams {
	drivers(stage: PUBLISHED) {
		id
		name
		number
		stream
		deleted
		city
		equipment
		grid
		team {
			name
			color {
				hex
			}
			photo {
				url
			}
		}
		photo {
			url
		}
		badge {
			url
		}
		badgeTitle
	}
	teams(stage: PUBLISHED) {
		id
		deleted
		color {
			hex
		}
		name
		photo {
			url
		}
	}
}

enum Grid {
  gridA
  gridB
  gridC
}

query GetStatsData($gridId: Grid!) {  # Use Grid type, not String
	datas(
		stage: DRAFT
		orderBy: createdAt_DESC
		first: 2
		where: { deleted: false, grid: $gridId }
	) {
		id
		grid
		csv {
			url
		}
	}
}

query GetData {
	datas(stage: DRAFT, orderBy: createdAt_DESC, where: { deleted: false }) {
		id
		grid
		deleted
		createdAt
		csv {
			url
		}
	}
}


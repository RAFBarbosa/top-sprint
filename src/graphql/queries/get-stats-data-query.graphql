query GetStatsData {
	datas(
		stage: DRAFT
		orderBy: createdAt_DESC
		first: 2
		where: { deleted: false }
	) {
		id
		grid
		csv {
			url
		}
	}
}

query GetData {
	datas(stage: DRAFT, orderBy: createdAt_DESC, where: { deleted: false }) {
		id
		grid
		deleted
		createdAt
		csv {
			url
		}
	}
}

query GetStatsDataA {
	datas(
		stage: DRAFT
		orderBy: createdAt_DESC
		first: 2
		where: { grid: gridA, deleted: false }
	) {
		id
		csv {
			url
		}
		grid
	}
}
query GetStatsDataB {
	datas(
		stage: DRAFT
		orderBy: createdAt_DESC
		first: 2
		where: { grid: gridB, deleted: false }
	) {
		id
		csv {
			url
		}
		grid
	}
}
